name: obtener-chat-id

# Correlo UNA vez, después de mandarle un mensaje a tu bot de Telegram.
# En el log aparece tu chat_id, que va como secret TELEGRAM_CHAT_ID.
on:
  workflow_dispatch:

jobs:
  chat-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Buscar chat_id
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/get_chat_id.py

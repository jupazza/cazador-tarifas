name: cazador-tarifas

on:
  schedule:
    # Modo continuo: cada corrida queda prendida ~5,5 horas (responde Telegram
    # al instante, lee feeds cada 5 min y consulta 4 rutas cada 10 min) y al
    # terminar se relanza sola. Este cron es solo el respaldo por si se corta.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Comando del bot para ejecutar ahora, sin la barra (ej: rutas). Vacío = corrida normal."
        required: false
        default: ""
      forzar_barrido:
        description: "Consultar TODAS las rutas ahora (no solo las que tocan)"
        type: boolean
        default: false

permissions:
  contents: write             # para guardar data/history.db en el repo
  actions: write              # para relanzarse sola al terminar

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el cazador
        env:
          PYTHONPATH: src
          PRICE_SOURCE: ${{ vars.PRICE_SOURCE || 'fastflights' }}
          RUTAS_POR_CORRIDA: ${{ vars.RUTAS_POR_CORRIDA || '4' }}
          FECHAS_POR_RUTA: ${{ vars.FECHAS_POR_RUTA || '2' }}
          FEEDS_CADA_MIN: ${{ vars.FEEDS_CADA_MIN || '5' }}
          BARRIDO_CADA_MIN: ${{ vars.BARRIDO_CADA_MIN || '10' }}
          MINUTOS_ENTRE_CONSULTAS: ${{ vars.MINUTOS_ENTRE_CONSULTAS || '30' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          BOT_COMMAND: ${{ github.event.inputs.command }}
          FORZAR: ${{ github.event.inputs.forzar_barrido }}
        run: |
          if [ -n "$BOT_COMMAND" ]; then
            python -m monitor.main --command "$BOT_COMMAND"
          elif [ "$FORZAR" = "true" ]; then
            python -m monitor.main --sweep-now
          else
            python -m monitor.main --loop 330
          fi

      - name: Guardar historial
        if: always()   # guarda lo recolectado aunque falle el envío
        run: |
          git config user.name  "cazador-bot"
          git config user.email "cazador-bot@users.noreply.github.com"
          git add -f data/history.db || true
          git commit -m "chore: actualiza historial [skip ci]" || echo "sin cambios"
          git pull --rebase --autostash -q || true
          git push || true

      - name: Relanzar modo continuo
        if: success() && (github.event.inputs.command || '') == '' && github.event.inputs.forzar_barrido != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main -R ${{ github.repository }}

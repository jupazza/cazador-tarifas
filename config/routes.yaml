# RUTAS INICIALES — se cargan UNA sola vez, en la primera corrida, a la base
# de datos (data/history.db). Después se manejan desde Telegram con
# /rutas, /crear, /editar, /pausar, /borrar. Cambiar este archivo después de
# la primera corrida no tiene efecto.
#
# origin / dest: código IATA del aeropuerto (EZE, MAD, JFK...)
# depart_range: ventana de fechas de IDA; en cada barrido se prueban 3 fechas
#               distintas dentro de esta ventana (van rotando)
# return_after_days: [mín, máx] noches de viaje (omitir = solo ida)
# target_price: TOPE en USD ida y vuelta; si aparece igual o menos, avisa
# drop_pct: también avisa si el precio baja este % contra la mediana de 30 días
#
# Los topes son valores de arranque (aprox. la mitad de lo que suele salir);
# ajustalos con /editar ID tope VALOR cuando veas los precios reales.

currency: USD

routes:
  # --- Europa ---
  - {name: "Buenos Aires → Madrid",     origin: EZE, dest: MAD, depart_range: ["2026-10-20", "2027-06-30"], return_after_days: [10, 20], target_price: 600, drop_pct: 40}
